name: Build Support Clue APK & AAB

on:
  workflow_dispatch:
  push:
    branches: [ "main", "support-clue-rebrand" ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify no Chrome, TWA or Custom Tabs wrapper
        run: |
          chmod +x scripts/verify-no-chrome-wrapper.sh
          ./scripts/verify-no-chrome-wrapper.sh

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Support-Clue-Debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Support-Clue-Debug-APK
          path: Support-Clue-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" \
            | sed '/-----BEGIN CERTIFICATE-----/d;/-----END CERTIFICATE-----/d' \
            | tr -d '\r\n' \
            | base64 --decode > SupportClue-release.jks
          test -s SupportClue-release.jks

      - name: Build signed release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Rename AAB
        run: cp app/build/outputs/bundle/release/app-release.aab Support-Clue.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Support-Clue-AAB
          path: Support-Clue.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename signed release APK
        run: cp app/build/outputs/apk/release/app-release.apk Support-Clue-Release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Support-Clue-Release-APK
          path: Support-Clue-Release.apk
          if-no-files-found: error
          retention-days: 30
