name: Build Smart Business Desk APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify no Chrome, TWA or Custom Tabs wrapper
        run: |
          chmod +x scripts/verify-no-chrome-wrapper.sh
          ./scripts/verify-no-chrome-wrapper.sh

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Smart-Business-Desk.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Business-Desk-APK
          path: Smart-Business-Desk.apk
          if-no-files-found: error
          retention-days: 30
